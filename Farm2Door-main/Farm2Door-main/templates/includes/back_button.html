<style>
  .site-back-button {
    position: fixed;
    top: 76px;
    left: 20px;
    z-index: 1000;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 38px;
    padding: 8px 13px 8px 10px;
    border: 1px solid rgba(46, 125, 50, 0.25);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 3px 12px rgba(52, 38, 28, 0.14);
    color: #2E7D32;
    font: 600 0.84rem/1.2 system-ui, sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .site-back-button:hover {
    transform: translateX(-2px);
    box-shadow: 0 5px 16px rgba(52, 38, 28, 0.2);
  }

  .site-back-button:focus-visible {
    outline: 3px solid rgba(249, 168, 37, 0.65);
    outline-offset: 2px;
  }

  .site-back-button svg {
    width: 17px;
    height: 17px;
    flex: 0 0 auto;
  }

  @media (max-width: 600px) {
    .site-back-button {
      top: 66px;
      left: 12px;
      min-height: 36px;
      padding-right: 11px;
    }
  }
</style>
<button class="site-back-button" type="button" aria-label="Go back to the previous page">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M19 12H5"></path>
    <path d="M12 19l-7-7 7-7"></path>
  </svg>
  <span>Back</span>
</button>
<script>
  document.querySelector('.site-back-button').addEventListener('click', function () {
    if (window.history.length > 1 && document.referrer.startsWith(window.location.origin)) {
      window.history.back();
      return;
    }
    window.location.href = "{% url 'home' %}";
  });
</script>
